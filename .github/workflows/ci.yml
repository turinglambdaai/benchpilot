name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
      - name: Resident runtime smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-runtime.sh
      - name: Graceful shutdown smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-shutdown.sh

  # Racket port gate (ADR 0002, Phase 0+): the ported tree must stay green
  # on the same OS matrix as the C# implementation.
  racket-port:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Test
        run: raco test racket/benchpilot
