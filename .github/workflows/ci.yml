name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Test (unit + driver + MCP + E2E)
        run: raco test racket/benchpilot
      - name: Resident runtime smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-runtime.sh
      - name: Graceful shutdown smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-shutdown.sh

  studio-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package
        run: raco pkg install --auto --no-docs crypto
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Studio schema compatibility gate
        working-directory: studio
        run: raco rivet schema check rivet-schema.json --json
      - name: Studio backend wire tests
        working-directory: studio
        run: raco test tests

  # Host compile gates: both native hosts must keep compiling against the
  # generated client on every change. The Windows job runs the full
  # msbuild/WinUI 3 build; the Linux job runs a full syntax+semantics pass
  # (g++ -fsyntax-only over every translation unit) because the gate's
  # purpose is API drift, and no Linux Racket distribution ships the static
  # libracketcs the embedding links.
  studio-linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet
      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libsecret-1-dev libncurses-dev zlib1g-dev liblz4-dev
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Resolve Racket include directory
        shell: bash
        run: |
          BIN="$(readlink -f "$(which racket)")"
          PREFIX="$(dirname "$(dirname "$BIN")")"
          echo "RIVET_RACKET_INCLUDE=$PREFIX/include" >> "$GITHUB_ENV"
          ls "$PREFIX/include" 2>/dev/null | head -5 \
            || { echo "no include dir under $PREFIX" >&2; exit 1; }
      - name: Compile Linux host
        shell: bash
        run: |
          g++ -std=c++20 -fsyntax-only -Wall -Wextra -Wpedantic \
            -I studio \
            -I rivet/platform/linux/runtime \
            -I rivet/platform/linux/system \
            -I rivet/runtime/include \
            -I "$RIVET_RACKET_INCLUDE" \
            $(pkg-config --cflags gtk4 gio-2.0) \
            studio/linux/src/main.cpp \
            rivet/platform/linux/runtime/backend.cpp \
            rivet/platform/linux/system/system_services.cpp \
            rivet/runtime/src/protocol.cpp

  studio-windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package
        shell: bash
        run: raco pkg install --auto --no-docs crypto
      - name: Link Rivet
        shell: bash
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Link benchpilot runtime
        shell: bash
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Build Windows host
        working-directory: studio
        env:
          RIVET_ROOT: ${{ github.workspace }}/rivet
        shell: bash
        run: raco rivet build
