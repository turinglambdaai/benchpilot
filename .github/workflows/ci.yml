name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Test (unit + driver + MCP + E2E)
        run: raco test racket/benchpilot
      - name: Resident runtime smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-runtime.sh
      - name: Graceful shutdown smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-shutdown.sh

  studio-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package
        run: raco pkg install --auto --no-docs crypto
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Studio schema compatibility gate
        working-directory: studio
        run: raco rivet schema check rivet-schema.json --json
      - name: Studio backend wire tests
        working-directory: studio
        run: raco test tests

  # Host compile gates: both native hosts must build against the generated
  # client on every change. `raco rivet build` compiles the Racket backend,
  # regenerates the platform clients and invokes the platform toolchain
  # (cmake/GTK4 on Linux, msbuild/WinUI 3 on Windows).
  studio-linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet
      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libsecret-1-dev libncurses-dev zlib1g-dev liblz4-dev
      - name: Install Racket (official CS distribution)
        # setup-racket's archive ships no libracketcs*.a, which the Linux
        # embedding links statically; the official distribution does.
        run: |
          curl -fsSL -o /tmp/racket-installer.sh \
            https://mirror.racket-lang.org/installers/9.3/racket-9.3-x86_64-linux-cs.sh
          sh /tmp/racket-installer.sh --unix-style --dest "$HOME/racket"
          echo "$HOME/racket/bin" >> "$GITHUB_PATH"
      - name: Locate Racket runtime files
        shell: bash
        run: |
          # Find the real installation by chasing its static CS library.
          A="$(find "$HOME" /opt /usr/local /usr -maxdepth 7 \
                 -name "libracketcs*.a" 2>/dev/null | head -1)"
          if [ -z "$A" ]; then
            echo "libracketcs*.a not found on the runner" >&2
            which -a racket >&2 || true
            exit 1
          fi
          LIB_DIR="$(dirname "$A")"
          PREFIX="$(dirname "$LIB_DIR")"
          echo "RIVET_RACKET_INCLUDE=$PREFIX/include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"
          find "$PREFIX" -maxdepth 3 \( -name "libracketcs*" -o -name "*.boot" \) | head -8
      - name: Install crypto package
        run: raco pkg install --auto --no-docs crypto
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Link benchpilot runtime
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Build Linux host
        working-directory: studio
        env:
          RIVET_ROOT: ${{ github.workspace }}/rivet
        run: raco rivet build

  studio-windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package
        shell: bash
        run: raco pkg install --auto --no-docs crypto
      - name: Link Rivet
        shell: bash
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Link benchpilot runtime
        shell: bash
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Build Windows host
        working-directory: studio
        env:
          RIVET_ROOT: ${{ github.workspace }}/rivet
        shell: bash
        run: raco rivet build
