name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Test (unit + driver + MCP + E2E)
        run: raco test racket/benchpilot
      - name: Resident runtime smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-runtime.sh
      - name: Graceful shutdown smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-shutdown.sh

  studio-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install rivet (upstream main)
        run: raco pkg install --auto --no-docs --skip-installed https://github.com/turinglambdaai/rivet.git
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Studio schema compatibility gate
        working-directory: studio
        run: raco rivet schema check rivet-schema.json --json
      - name: Studio backend wire tests
        working-directory: studio
        run: raco test tests
