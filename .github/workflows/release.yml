name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Directory.Build.props version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n1 | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Directory.Build.props VersionPrefix '$VERSION'" >&2
            exit 1
          fi
          echo "release preflight: version $VERSION verified"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build -c Release
      - name: Test (unit + e2e)
        run: dotnet test --no-build -c Release
      - name: Smoke runtime + graceful shutdown
        if: runner.os == 'Linux'
        run: |
          bash scripts/smoke-runtime.sh
          bash scripts/smoke-shutdown.sh

  publish:
    needs: [preflight, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single-file shells
        run: |
          VER="${{ steps.version.outputs.version }}"
          RID="${{ matrix.rid }}"
          STAGE="stage/$RID"
          mkdir -p "$STAGE"
          for project in Benchpilot.RuntimeHost Benchpilot.Cli Benchpilot.Mcp; do
            dotnet publish "src/$project" \
              -c Release -r "$RID" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None \
              -p:DebugSymbols=false \
              -p:Version="$VER" \
              -o "$STAGE"
          done

      - name: Package
        id: package
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          RID="${{ matrix.rid }}"
          NAME="benchpilot-$VER-$RID"
          mkdir "$NAME"
          # Ship exactly the three executables. Plain names on POSIX, .exe on
          # Windows; publish intermediates (pdb, static web assets manifests)
          # stay behind.
          for exe in benchpilotd benchpilot benchpilot-mcp; do
            if [[ -f "stage/$RID/$exe" ]]; then
              mv "stage/$RID/$exe" "$NAME/"
            elif [[ -f "stage/$RID/$exe.exe" ]]; then
              mv "stage/$RID/$exe.exe" "$NAME/"
            else
              echo "::error::publish output missing: $exe"
              ls -la "stage/$RID"
              exit 1
            fi
          done
          ls -la "$NAME"
          mkdir -p artifacts
          if [[ "$RID" == win-* ]]; then
            zip -q -r "artifacts/$NAME.zip" "$NAME"
            echo "file=artifacts/$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "artifacts/$NAME.tar.gz" "$NAME"
            echo "file=artifacts/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debian package
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: bash packaging/linux/build-deb.sh "${{ steps.version.outputs.version }}" artifacts

      - name: Install and remove Debian package
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./artifacts/benchpilot-*-linux-x64.deb
          test -x /opt/benchpilot/benchpilot
          test -L /usr/bin/benchpilot
          sudo apt-get remove -y benchpilot
          test ! -e /usr/bin/benchpilot

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchpilot-${{ matrix.rid }}
          path: artifacts/*
          retention-days: 5
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: artifacts/SHA256SUMS.txt

      - name: Generate Homebrew formula and scoop manifest
        run: bash scripts/gen-dist-manifests.sh "${GITHUB_REF_NAME#v}" artifacts

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## "ver"( |$)" {flag=1; next}
            /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for details." > notes.md
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md \
            --generate-notes \
            --title "BenchPilot $GITHUB_REF_NAME" \
            artifacts/*
