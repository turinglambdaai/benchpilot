name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches the version constants
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG_VERSION" CHANGELOG.md || { echo "CHANGELOG.md has no '## $TAG_VERSION' section" >&2; exit 1; }
          echo "release preflight: version $TAG_VERSION verified across runtime, studio, changelog and tag"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install package
        run: raco pkg install --auto --name benchpilot --link racket
      - name: Test (unit + driver + MCP + E2E)
        run: raco test racket/benchpilot
      - name: Smoke runtime + graceful shutdown
        if: runner.os == 'Linux'
        run: |
          bash scripts/smoke-runtime.sh
          bash scripts/smoke-shutdown.sh

  publish:
    needs: [preflight, test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-15
          - rid: osx-x64
            # macos-13 retired 2025-12-04; macos-15-intel is the last Intel image.
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: '${{ matrix.rid == ''osx-arm64'' && ''arm64'' || matrix.rid == ''linux-arm64'' && ''arm64'' || ''x64'' }}'
          distribution: full
          variant: CS
          version: '9.3'

      - name: Determine version from tag
        id: version
        # pwsh (the Windows default) cannot expand ${REF#v}; the empty
        # version used to ship benchpilot--win-x64.zip and starve the
        # manifest generator of its checksum entry.
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          bash scripts/build-dist.sh "$VER" "${{ matrix.rid }}" "dist/${{ matrix.rid }}"

      - name: Package
        id: package
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          RID="${{ matrix.rid }}"
          NAME="benchpilot-$VER-$RID"
          mv "dist/$RID" "$NAME"
          mkdir -p artifacts
          if [[ "$RID" == win-* ]]; then
            # windows runners ship bsdtar; -a picks zip from the extension
            tar -a -cf "artifacts/$NAME.zip" "$NAME"
          else
            tar -czf "artifacts/$NAME.tar.gz" "$NAME"
          fi

      - name: Build Debian package
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: bash packaging/linux/build-deb.sh "${{ steps.version.outputs.version }}" artifacts

      - name: Install and remove Debian package
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./artifacts/benchpilot-*-linux-x64.deb
          test -x /opt/benchpilot/bin/benchpilot
          test -d /opt/benchpilot/lib
          grep -q 'exec "/opt/benchpilot/bin/benchpilot"' /usr/bin/benchpilot
          /usr/bin/benchpilot --version
          sudo apt-get remove -y benchpilot
          test ! -e /usr/bin/benchpilot

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchpilot-${{ matrix.rid }}
          path: artifacts/*
          retention-days: 5
          if-no-files-found: error

  studio-macos:
    needs: [preflight, test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: 6eb0837a7e294fe302b56e9a379988edfe69e3cf
          path: rivet

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          # arm64-native packaging: without this the runner builds under
          # Rosetta and ships an x86_64 app (the PodLens release bug).
          architecture: arm64
          distribution: full
          variant: CS
          version: '9.3'

      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto

      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"

      - name: Link benchpilot runtime
        run: raco pkg install --auto --name benchpilot --link racket

      - name: Studio backend wire tests
        working-directory: studio
        run: raco test tests

      - name: Package Studio app (includes launch smoke)
        working-directory: studio
        run: raco rivet package

      - name: Human installer (DMG, drag to Applications)
        working-directory: studio
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          volname="BenchPilot Studio"
          # Family artifact naming: <product>-<version>-<platform>-<arch>.
          # Studio is packaged arm64-native (see the Racket setup above).
          dmg="benchpilot-studio-${VERSION}-macos-arm64.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/benchpilot-studio.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$volname" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil attach "$dmg" -mountpoint /tmp/benchpilot-studio-dmg-verify -readonly
          test -d /tmp/benchpilot-studio-dmg-verify/benchpilot-studio.app
          hdiutil detach /tmp/benchpilot-studio-dmg-verify
          mv "$dmg" "$GITHUB_WORKSPACE"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: benchpilot-studio-*-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchpilot-studio-macos
          path: benchpilot-studio-*-macos-arm64.dmg
          retention-days: 5
          if-no-files-found: error

  release:
    needs: [publish, studio-macos]
    # workflow_dispatch runs validate packaging only; a release is created
    # from tag pushes alone.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: artifacts/SHA256SUMS

      - name: Generate Homebrew formula and scoop manifest
        run: bash scripts/gen-dist-manifests.sh "${GITHUB_REF_NAME#v}" artifacts

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## "ver"( |$)" {flag=1; next}
            /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for details." > notes.md
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md \
            --generate-notes \
            --title "BenchPilot $GITHUB_REF_NAME" \
            artifacts/*
